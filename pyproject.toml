[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-lunar-lander"
version = "0.1.0"
description = "DQN and DDQN robustness experiments for LunarLander-v3"
requires-python = ">=3.11,<3.15"
dependencies = [
    "gymnasium[box2d]>=1.0,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "PyYAML>=6,<7",
    "torch>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: bounded local smoke validation",
    "one_step: exactly-one-step learning validation",
    "colab: checks intended for the Colab runtime",
    "full_training: prohibited in the local OpenCode environment",
]
